name: CI

on:
  push:
    branches: [v2]
  pull_request:

jobs:
  lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Union of PHP versions across non-EOL Magento 2.4.7 / 2.4.8 / 2.4.9
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check all PHP files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l

  coding-standard:
    name: Coding standard (phpcs + phpmd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Register Magento coding standard
        run: vendor/bin/phpcs --config-set installed_paths vendor/magento/magento-coding-standard
      - name: PHP CodeSniffer (Magento2)
        run: vendor/bin/phpcs --standard=Magento2 Api Component Console Exception Model ViewModel
      - name: PHP Mess Detector
        run: vendor/bin/phpmd Api,Component,Console,Exception,Model,ViewModel text cleancode,codesize,controversial,design,naming,unusedcode

  # TODO: Magento integration matrix (PHPUnit + PHPStan against magento/framework).
  # Requires repo.magento.com credentials as repository secrets:
  #   secrets.MAGENTO_USERNAME / secrets.MAGENTO_PASSWORD
  # Valid Magento x PHP combinations to cover:
  #   2.4.7 -> 8.1, 8.2, 8.3   |   2.4.8 -> 8.2, 8.3, 8.4   |   2.4.9 -> 8.3, 8.4, 8.5
  # Added in a follow-up once the test harness (Phase 1) lands.
